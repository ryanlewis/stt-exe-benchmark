[project]
name = "stt-exe-benchmark"
version = "0.1.0"
description = "CPU-only STT bake-off + realtime POC on exe.dev VMs"
requires-python = ">=3.11"
dependencies = [
    "jiwer==4.0.0",
    "numpy==2.5.5",
    "soundfile==0.14.0",
    "scipy==1.18.1",
    "psutil==7.2.2",
    "click==8.5.1",
    "datasets[audio]==5.2.0",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=1.10"]
faster-whisper = ["faster-whisper>=1.0"]
moonshine = ["useful-moonshine-onnx>=0.2.0", "onnxruntime>=1.18"]
vosk = ["vosk>=0.3.45"]
whispercpp = ["pywhispercpp>=1.2"]
all = [
    "sherpa-onnx==2.0.3",
    "faster-whisper==1.2.1",
    "useful-moonshine-onnx==20251121",
    "onnxruntime==1.32.0",
    "vosk==0.3.45",
    "pywhispercpp==1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark", "server"]
